name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Check Bash scripts and completion syntax
        shell: bash
        run: |
          bash -n utils/completions/nq.bash
          bash -n docs/examples/wikidata/fetch-wikidata-data.sh
          bash -n docs/examples/wikidata/qrytest.sh
          bash -n docs/assets/generate-terminal-demo.sh

      - name: Check Markdown style
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: "**/*.md"
