name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or rebuild, such as v1.2.3
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '[<>]' '/^[[:space:]]*<version>/ { print $3; exit }' pom.xml)"
          if [[ -z "$version" ]]; then
            echo "::error title=Missing project version::Could not read the project version from pom.xml."
            exit 1
          fi
          if [[ "$version" == *SNAPSHOT* ]]; then
            echo "::error title=Snapshot release::Set a non-SNAPSHOT version in pom.xml before releasing."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error title=Version mismatch::Tag $RELEASE_TAG does not match pom.xml version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check Homebrew publication secret
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::error title=Missing HOMEBREW_TAP_TOKEN::Run ./actions-setup.sh before releasing."
            exit 1
          fi

  test:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test

  build:
    needs:
      - validate
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
            executable: target/nq
            archive: tar
          - runner: ubuntu-22.04
            platform: linux-x64
            executable: target/nq
            archive: tar
          - runner: windows-2022
            platform: windows-x64
            executable: target/nq.exe
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          version: "25.0"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Build native executable
        run: mvn --batch-mode --no-transfer-progress "-Pnative,jdbc-common" -DskipTests clean package

      - name: Smoke-test Unix executable
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          executable="${{ matrix.executable }}"
          "$executable" -h >/dev/null
          test "$("$executable" --version)" = "nq $VERSION"
          "$executable" capabilities > capabilities.json
          grep -F '"command":"capabilities"' capabilities.json
          grep -F '"contract_version":1' capabilities.json
          "$executable" docs/examples/identity-country-counts.nq \
            docs/examples/identity-customers.json > actual.json
          diff -u \
            <(printf '%s\n' '{"result":{"region":[{"country":"GB","customerCount":2},{"country":"US","customerCount":4}]}}') \
            actual.json
          "$executable" --cache docs/examples/customers.json \
            --cache-dir "$RUNNER_TEMP/nq-cache" >/dev/null
          "$executable" catalog '*' \
            --cache-dir "$RUNNER_TEMP/nq-cache" >/dev/null
          "$executable" 'output json; select 1 into {result.value};' \
            --db h2 --database mem:release_smoke > jdbc.json
          grep -Fx '{"result":{"value":1}}' jdbc.json
          "$executable" 'output json; select 2 into {result.value};' \
            --jdbc-database jdbc:h2:mem:release_url_smoke > jdbc-url.json
          grep -Fx '{"result":{"value":2}}' jdbc-url.json
          printf '%s\n' '{}' | "$executable" \
            'output json; select 3 into {result.value};' > stdin.json
          grep -Fx '{"result":{"value":3}}' stdin.json

      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $executable = ".\target\nq.exe"
          & $executable -h | Out-Null
          if ((& $executable --version) -ne "nq $env:VERSION") {
            throw "Version output does not match release version"
          }
          $capabilities = & $executable capabilities | ConvertFrom-Json
          if ($capabilities.command -ne "capabilities" -or `
              $capabilities.details.contract_version -ne 1) {
            throw "Capability contract smoke output mismatch"
          }
          $actual = & $executable `
            docs/examples/identity-country-counts.nq `
            docs/examples/identity-customers.json
          $expected = '{"result":{"region":[{"country":"GB","customerCount":2},{"country":"US","customerCount":4}]}}'
          if ($actual -ne $expected) { throw "Hero query output mismatch" }
          $stdinResult = '{}' | & $executable `
            'output json; select 3 into {result.value};'
          if ($stdinResult -ne '{"result":{"value":3}}') {
            throw "Redirected-stdin/terminal-detection smoke output mismatch"
          }
          & $executable --cache docs/examples/customers.json `
            --cache-dir "$env:RUNNER_TEMP\nq-cache" | Out-Null
          '{}' | & $executable catalog `
            --cache --cache-dir "$env:RUNNER_TEMP\nq-cache" | Out-Null
          $jdbc = & $executable 'output json; select 1 into {result.value};' `
            --input-text '{}' `
            --db h2 --database mem:release_smoke
          if ($jdbc -ne '{"result":{"value":1}}') {
            throw "JDBC smoke output mismatch"
          }
          $jdbcUrl = & $executable 'output json; select 2 into {result.value};' `
            --input-text '{}' `
            --jdbc-database jdbc:h2:mem:release_url_smoke
          if ($jdbcUrl -ne '{"result":{"value":2}}') {
            throw "URL-only JDBC smoke output mismatch"
          }
      - name: Package Unix executable
        if: matrix.archive == 'tar'
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          tar -C target -czf "dist/nq-${VERSION}-${PLATFORM}.tar.gz" nq

      - name: Package Windows executable
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path target/nq.exe `
            -DestinationPath "dist/nq-$env:VERSION-$env:PLATFORM.zip"

      - name: Build and smoke-test Chocolatey package
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $tools = "util\chocolatey\tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Copy-Item target\nq.exe "$tools\nq.exe"
          Copy-Item LICENSE.txt "$tools\LICENSE.txt"

          $exeHash = (Get-FileHash "$tools\nq.exe" -Algorithm SHA256).Hash.ToLower()
          $verification = Get-Content `
            util\chocolatey\VERIFICATION.txt.template -Raw
          $verification = $verification.Replace("__VERSION__", $env:VERSION)
          $verification = $verification.Replace("__EXE_SHA256__", $exeHash)
          Set-Content `
            "$tools\VERIFICATION.txt" `
            $verification `
            -Encoding utf8NoBOM

          Push-Location util\chocolatey
          try {
            choco pack nq.nuspec `
              --version $env:VERSION `
              --output-directory ..\..\dist
          } finally {
            Pop-Location
          }

          $source = (Resolve-Path dist).Path
          choco install nq `
            --version $env:VERSION `
            --source $source `
            --yes `
            --no-progress
          try {
            $installed = & "$env:ChocolateyInstall\bin\nq.exe" --version
            if ($installed -ne "nq $env:VERSION") {
              throw "Chocolatey package installed unexpected version: $installed"
            }
          } finally {
            choco uninstall nq --yes --no-progress
          }

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  jvm:
    needs:
      - validate
      - test
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and smoke-test JVM artifact
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -DskipTests package
          jar="target/nq-${VERSION}.jar"
          test "$(java -jar "$jar" --version)" = "nq $VERSION"
          java -jar "$jar" capabilities > capabilities.json
          grep -F '"command":"capabilities"' capabilities.json
          grep -F '"contract_version":1' capabilities.json
          java -jar "$jar" docs/examples/identity-country-counts.nq \
            docs/examples/identity-customers.json > actual.json
          diff -u \
            <(printf '%s\n' '{"result":{"region":[{"country":"GB","customerCount":2},{"country":"US","customerCount":4}]}}') \
            actual.json
          java -jar "$jar" --cache docs/examples/customers.json \
            --cache-dir "$RUNNER_TEMP/nq-cache" >/dev/null
          java -jar "$jar" catalog '*' \
            --cache-dir "$RUNNER_TEMP/nq-cache" >/dev/null
          java -jar "$jar" 'output json; select 1 into {result.value};' \
            --db h2 --database mem:release_smoke > jdbc.json
          grep -Fx '{"result":{"value":1}}' jdbc.json
          mkdir -p dist
          cp "$jar" "dist/nq-${VERSION}-jvm.jar"

      - name: Upload packaged JVM artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-jvm
          path: dist/*
          if-no-files-found: error

  publish:
    needs:
      - validate
      - build
      - jvm
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum nq-* nq.*.nupkg > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "NQ $VERSION" \
              --generate-notes
          fi

  homebrew:
    needs:
      - validate
      - publish
    runs-on: macos-15
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v6

      - name: Download macOS release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-darwin-arm64
          path: dist

      - name: Publish Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          NQ_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh auth setup-git --hostname github.com --force
          ./util/build_brew
