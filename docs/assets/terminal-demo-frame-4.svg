<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect width="1000" height="560" rx="22" fill="#0b1020"/>
  <rect width="1000" height="58" rx="22" fill="#182036"/>
  <rect y="38" width="1000" height="20" fill="#182036"/>
  <circle cx="31" cy="29" r="8" fill="#ff5f57"/><circle cx="57" cy="29" r="8" fill="#febc2e"/><circle cx="83" cy="29" r="8" fill="#28c840"/>
  <text x="500" y="36" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">NQ — SQL for nested data</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
    <text x="34" y="100" fill="#65d1ff">$</text>
    <text x="58" y="100" fill="#f8fafc">nq identity-country-counts.nq identity-customers.json</text>
    <text x="34" y="160" fill="#94a3b8">{</text>
    <text x="58" y="198" fill="#f9a8d4">"result"</text><text x="154" y="198" fill="#94a3b8">: {</text>
    <text x="82" y="236" fill="#f9a8d4">"region"</text><text x="178" y="236" fill="#94a3b8">: [</text>
    <text x="106" y="274" fill="#94a3b8">{ </text><text x="130" y="274" fill="#f9a8d4">"country"</text><text x="238" y="274" fill="#94a3b8">: </text><text x="262" y="274" fill="#86efac">"GB"</text><text x="310" y="274" fill="#94a3b8">, </text><text x="334" y="274" fill="#f9a8d4">"customerCount"</text><text x="526" y="274" fill="#94a3b8">: </text><text x="550" y="274" fill="#86efac">"2"</text><text x="586" y="274" fill="#94a3b8"> },</text>
    <text x="106" y="312" fill="#94a3b8">{ </text><text x="130" y="312" fill="#f9a8d4">"country"</text><text x="238" y="312" fill="#94a3b8">: </text><text x="262" y="312" fill="#86efac">"US"</text><text x="310" y="312" fill="#94a3b8">, </text><text x="334" y="312" fill="#f9a8d4">"customerCount"</text><text x="526" y="312" fill="#94a3b8">: </text><text x="550" y="312" fill="#86efac">"4"</text><text x="586" y="312" fill="#94a3b8"> }</text>
    <text x="82" y="350" fill="#94a3b8">]</text>
    <text x="58" y="388" fill="#94a3b8">}</text>
    <text x="34" y="426" fill="#94a3b8">}</text>
    <text x="34" y="490" fill="#86efac">One query. New hierarchy. No application code.</text>
    <rect x="34" y="514" width="12" height="25" fill="#65d1ff"/>
