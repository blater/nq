<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect width="1000" height="560" rx="22" fill="#0b1020"/>
  <rect width="1000" height="58" rx="22" fill="#182036"/>
  <rect y="38" width="1000" height="20" fill="#182036"/>
  <circle cx="31" cy="29" r="8" fill="#ff5f57"/><circle cx="57" cy="29" r="8" fill="#febc2e"/><circle cx="83" cy="29" r="8" fill="#28c840"/>
  <text x="500" y="36" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">NQ — SQL for nested data</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
    <text x="34" y="96" fill="#65d1ff">$</text><text x="58" y="96" fill="#f8fafc">cat identity-country-counts.nq</text>
    <text x="34" y="140" fill="#c084fc">select</text>
    <text x="58" y="175" fill="#f8fafc">a.country_code </text><text x="262" y="175" fill="#c084fc">into</text><text x="322" y="175" fill="#fbbf24"> {result.region.country},</text>
    <text x="58" y="210" fill="#f8fafc">count(distinct c.id) </text><text x="310" y="210" fill="#c084fc">into</text><text x="370" y="210" fill="#fbbf24"> {result.region.customerCount}</text>
    <text x="34" y="245" fill="#c084fc">from</text><text x="92" y="245" fill="#f8fafc"> customer c</text>
    <text x="34" y="280" fill="#c084fc">join</text><text x="92" y="280" fill="#f8fafc"> address a </text><text x="236" y="280" fill="#c084fc">on</text><text x="274" y="280" fill="#f8fafc"> a.customer_id = c.id</text>
    <text x="34" y="315" fill="#c084fc">join</text><text x="92" y="315" fill="#f8fafc"> kyc k </text><text x="176" y="315" fill="#c084fc">on</text><text x="214" y="315" fill="#f8fafc"> k.customer_id = c.id</text>
    <text x="34" y="350" fill="#c084fc">group by</text><text x="142" y="350" fill="#f8fafc"> a.country_code</text>
    <text x="34" y="385" fill="#c084fc">structure</text><text x="154" y="385" fill="#fbbf24"> {result.region}</text><text x="350" y="385" fill="#f8fafc"> key (country_key);</text>
    <text x="34" y="454" fill="#cbd5e1">Familiar SQL controls the query; paths control the output.</text>
    <rect x="34" y="493" width="12" height="25" fill="#65d1ff"/>
  </g>
</svg>
